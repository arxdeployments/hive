# Dependency updates, which ci.yml has been telling readers were handled since the
# day the action SHAs were pinned.
#
# That comment says "(Dependabot handles pinned SHAs and rewrites the comment)".
# Dependabot was never configured. So every `uses:` in the workflow has been frozen
# at whatever was current when it was written, and the comment actively reassured
# anyone who wondered. Measured on 2026-09-03:
#
#   actions/checkout           v4.4.0 -> v7.0.1
#   actions/setup-node         v4.4.0 -> v7.0.0
#   actions/setup-python       v5.6.0 -> v7.0.0
#   actions/upload-artifact    v4.6.2 -> v7.0.1
#   hashicorp/setup-terraform  v3.1.2 -> v4.0.1
#
# Three major versions behind, across the board.
#
# WHY THIS IS SAFE TO TURN ON NOW, AND WOULD NOT HAVE BEEN BEFORE
#
# Batches 46 and 47 pinned four transitive packages the application reaches into
# directly, and the reason those pins were the right call is that nothing watched
# for updates. Automation changes that trade — but only because those batches also
# added the tests that detect a semantic break rather than a version change:
#
#   * urllib3 — services/push.py overrides its PRIVATE _new_conn to check the
#     address a push actually connects to. A version that stopped calling that
#     method would leave the subclass valid and the SSRF guard silently gone.
#     tests/test_push_ssrf_guard.py connects to a real loopback listener and
#     asserts the guard fires, so a Dependabot bump that breaks it fails CI.
#   * anyio — api/notifications.py and services/push.py pass abandon_on_cancel,
#     which did not exist before 4.1. scripts/check_pinned_imports.py keeps it
#     pinned and the suite exercises the call.
#
# Every Dependabot PR runs the full pipeline, so those tests are the gate. Without
# them this file would be a way to lose a security guard on a Tuesday.
version: 2
updates:
  # Actions first: these are the ones the stale comment was about, and a compromised
  # or abandoned action is the supply-chain risk the SHA pinning exists to bound.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Patch and minor together — reviewing five separate PRs for routine bumps is
      # how a queue gets ignored. Majors stay separate; v4 to v7 on checkout is not
      # a rubber stamp.
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # COUPLED CLUSTERS FIRST, AND WITHOUT AN update-types RESTRICTION.
      #
      # requirements.txt pins packages that constrain each other, and grouping only
      # by update type let the two sides move independently. That is not a review
      # convenience issue, it produces a manifest pip refuses to resolve. Two of the
      # twenty-one PRs open on 2026-09-03 were stuck on exactly this, and neither was
      # a broken dependency:
      #
      #   #71  starlette 0.46.2 -> 1.6.0, while fastapi 0.115.12 needs starlette<0.47.0
      #   #67  pywebpush 2.5.0, which needs cryptography>=47.0.0, while cryptography
      #        stayed at 44.0.0 because majors were excluded from the group
      #
      # Both failed at `pip install`, so nothing after it ran and the queue behind
      # them stopped. Grouping a cluster lets Dependabot resolve it as a unit and
      # propose the pair, which CI can then actually judge.
      #
      # These groups deliberately set no update-types. A cluster restricted to
      # [minor, patch] lets a major bump of one member fall through to its own PR,
      # which is how #71 happened. scripts/check_dependency_groups.py reads the
      # couplings out of installed metadata and fails if a cluster can split.
      python-asgi-stack:
        patterns: [fastapi, starlette, "pydantic*", anyio]
      python-http-stack:
        patterns: [requests, urllib3, pywebpush, cryptography]
      python-database:
        patterns: [alembic, sqlalchemy, asyncpg]
      # aiohttp is here because livekit-api requires it and Batch 51 pinned it:
      # services/calls.py builds aiohttp.ClientTimeout directly to replace the
      # LiveKit client's 60-second default. check_dependency_groups.py caught the
      # split the moment the pin was added, which is what it is for.
      python-livekit:
        patterns: ["livekit*", pyjwt, aiohttp]
      # pytest-asyncio 0.25.3 requires pytest<9 — an upper bound already in force.
      # #70 (pytest 9.1.1) and #68 (pytest-asyncio 1.4.0) are the same coupling hit
      # from opposite ends, and both failed at `pip install`. Grouped, this pair
      # resolves on its own: pytest-asyncio 1.4.0 accepts pytest<10,>=8.4, so
      # Dependabot can propose 9.1.1 with 1.4.0 and CI can judge the result.
      python-pytest:
        patterns: ["pytest*"]
      # uvicorn[standard] pulls pyyaml>=5.1 and websockets>=10.4, both pinned in
      # requirements-dev.txt. Only visible once the extras on a pin are honoured;
      # the `extra == "standard"` markers evaluate False with no extra in context,
      # silently, so dropping the extras dropped the whole cluster.
      python-uvicorn-standard:
        patterns: [uvicorn, pyyaml, websockets]
      # Everything else: routine bumps together, majors on their own so they get
      # individual review.
      #
      # Last by preference, not by necessity. First match wins, and because this
      # group is restricted to [minor, patch] while the cluster groups above are
      # not, the two partitions are disjoint by update type — putting this first
      # would still keep each cluster whole, it would just move the clusters'
      # routine bumps in here instead. Left last so a cluster travels as a cluster
      # for every update type, which is the PR a reviewer can actually reason
      # about. Ordering does become load-bearing between two cluster groups whose
      # patterns overlap, and the check models that.
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Both images, separately, because they are built from different bases and a bump
  # to one says nothing about the other.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: docker
    groups:
      backend-image-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: docker
    groups:
      frontend-image-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The compose stack, which is a separate Dependabot ecosystem from `docker` and
  # was missed entirely on the first pass. infra/docker-compose.yml and its prod
  # sibling pin postgres, redis, caddy, minio and livekit-server — the images the
  # production box actually runs, via user_data.sh.tftpl. Two of those sit on
  # :latest, which Dependabot cannot bump meaningfully; the alpine-tagged three it
  # can, and that is three more than before.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: infra
    groups:
      compose-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Providers, against the committed .terraform.lock.hcl. The terraform job runs
  # `init -backend=false` using that lock, so a provider bump is checked by the
  # same validate step that already guards hand edits.
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: infra
    groups:
      terraform-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
