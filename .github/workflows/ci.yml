name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rxhive_test
          POSTGRES_USER: rxhive
          POSTGRES_PASSWORD: rxhive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rxhive" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive_test
      - name: Tests
        run: pytest -q
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive_test
          RXHIVE_REDIS_URL: redis://localhost:6379/0
          RXHIVE_ENVIRONMENT: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  contracts:
    # Catches frontend calls to endpoints the API doesn't expose. This class of
    # bug lints and builds cleanly and only fails at runtime in a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python scripts/check_contracts.py

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rxhive
          POSTGRES_USER: rxhive
          POSTGRES_PASSWORD: rxhive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rxhive" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: rxhive
          MINIO_ROOT_PASSWORD: rxhive-dev
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive
      RXHIVE_REDIS_URL: redis://localhost:6379/0
      RXHIVE_S3_ENDPOINT: http://localhost:9000
      RXHIVE_S3_PUBLIC_ENDPOINT: http://localhost:9000
      RXHIVE_S3_ACCESS_KEY: rxhive
      RXHIVE_S3_SECRET_KEY: rxhive-dev
      RXHIVE_LIVEKIT_API_KEY: devkey
      RXHIVE_LIVEKIT_API_SECRET: devsecret-at-least-32-characters-long
      RXHIVE_SEED_SUPERADMIN_EMAIL: admin@rhythmrx.ai
      RXHIVE_SEED_SUPERADMIN_PASSWORD: CiSuperadminPass123
      # All E2E traffic shares one source IP — raise the per-IP login budget.
      RXHIVE_RATE_LIMIT_LOGIN: "200"
      E2E_API_URL: http://127.0.0.1:8000
      E2E_SUPERADMIN_PASSWORD: CiSuperadminPass123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Install frontend + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # global-setup waits for /api/health and fails loudly if the stack is down.
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t rxhive-api ./backend
      - name: Build frontend image
        run: docker build -t rxhive-web ./frontend
