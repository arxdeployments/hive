name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rxhive_test
          POSTGRES_USER: rxhive
          POSTGRES_PASSWORD: rxhive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rxhive" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive_test
      - name: Tests
        run: pytest -q
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive_test
          RXHIVE_REDIS_URL: redis://localhost:6379/0
          RXHIVE_ENVIRONMENT: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t rxhive-api ./backend
      - name: Build frontend image
        run: docker build -t rxhive-web ./frontend
