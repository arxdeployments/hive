name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. With no `permissions:` block the token
# inherits the repository default, which for older repositories is write-all —
# every job here, including the ones that execute third-party actions and a
# remote install script, would hold a token that can push to main and edit
# releases. Nothing in this workflow writes to the repository; it checks out
# code and runs tests. Artifact upload does not need `contents: write`.
permissions:
  contents: read

# Every `uses:` below is pinned to a full commit SHA, with the tag it resolved
# from in the trailing comment. A tag is a mutable pointer the action's owner
# can move, so `@v4` is a promise about intent rather than about bytes: the
# same workflow can run different third-party code on two consecutive days,
# and a compromised upstream account is enough to change it. A SHA cannot be
# moved. The cost is that these no longer pick up fixes on their own — bump
# them deliberately (Dependabot handles pinned SHAs and rewrites the comment).

# One run per ref. Without this, three pushes to a branch in quick succession
# run three full pipelines to completion — and this pipeline boots Postgres,
# Redis, MinIO, a LiveKit SFU and a browser. Superseded PR runs are cancelled;
# pushes to main are not, so main always has a complete result per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Postgres + Redis + MinIO come up, then ~170 tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rxhive_test
          POSTGRES_USER: rxhive
          POSTGRES_PASSWORD: rxhive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rxhive" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # The suite has always contained tests that upload for real —
      # test_media_upload_and_authenticated_serving predates all of this — but
      # this job had no object store, so they could only ever fail. It went
      # unnoticed because the ruff-format step above failed first and the job
      # never reached Tests. Same image and credentials as the e2e job.
      minio:
        # minio/minio:edge-cicd, not bitnami/minio — Bitnami withdrew their public
        # Docker Hub catalogue and that tag now 404s, which failed this job at
        # container start before a single step ran. The edge-cicd tag is MinIO's
        # own build for exactly this: its default command is `minio server /data`,
        # and a GitHub Actions service container has no way to supply one.
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: rxhive
          MINIO_ROOT_PASSWORD: rxhive-dev
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive_test
      - name: Tests
        run: pytest -q
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive_test
          RXHIVE_REDIS_URL: redis://localhost:6379/0
          RXHIVE_S3_ENDPOINT: http://localhost:9000
          RXHIVE_S3_PUBLIC_ENDPOINT: http://localhost:9000
          RXHIVE_S3_ACCESS_KEY: rxhive
          RXHIVE_S3_SECRET_KEY: rxhive-dev
          RXHIVE_ENVIRONMENT: test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # npm ci, lint, unit tests and a Vite build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Store logic that the E2E suite cannot reach: those tests need a live SFU
      # and cannot land a second call inside a two-second window on purpose.
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  contracts:
    # Catches frontend calls to endpoints the API doesn't expose. This class of
    # bug lints and builds cleanly and only fails at runtime in a browser.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a pip install and one text scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # BEFORE pip install, deliberately. This is stdlib-only and reads the
      # repository, so running it first means a manifest that lets the resolver
      # choose an unpinned package is rejected before that package's build backend
      # gets to execute on the runner.
      #
      # A direct import of something nothing pins is a dependency the resolver
      # picks for us. Batch 46 found urllib3 that way — app/ overrides its private
      # _new_conn, and a version that stopped calling it would have silently
      # disabled an SSRF guard. Batch 47 found anyio, which app/ calls with a
      # keyword that did not exist before 4.1 while starlette allows 3.6.2 upward.
      - run: python scripts/check_pinned_imports.py
      - run: pip install -r backend/requirements.txt
      - run: python scripts/check_contracts.py
      # The other half, and it needs the environment. The static check above trusts
      # a hand-maintained import->distribution map; this validates that map against
      # importlib.metadata, because a wrong entry makes the static check look for
      # the wrong name and PASS while the real package is unpinned. Its own first
      # run found `pil` pointing at nothing, Pillow's import name being `PIL`.
      - run: python scripts/check_pinned_imports.py --check-mappings

  terraform:
    # The infrastructure had no automated check of any kind: a syntax error, a
    # bad reference or an unformatted file was discovered by an operator running
    # a live apply against production. `init -backend=false` needs no AWS
    # credentials and no state, so this is a pure static check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9"
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend, no credentials)
        # Uses the committed .terraform.lock.hcl, which carries checksums for
        # linux_amd64 among four platforms — without those this step cannot
        # resolve providers on a Linux runner at all.
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color

  compose:
    # The compose files had no automated check of any kind, and the production
    # one is not merely a convenience: user_data.sh.tftpl runs
    # `docker compose up -d --build` against it on every boot and every
    # bootstrap re-run, so a YAML error, a bad anchor or a mistyped
    # interpolation means the stack simply never comes up — discovered on the
    # box, after the deploy, with the previous containers already stopped.
    #
    # `config` is a pure parse-and-resolve: it renders the merged model without
    # pulling an image, building anything or contacting a registry.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - name: Seed infra/.env from the committed example
        # Both compose files carry a service-level `env_file: [.env]`, and
        # compose requires that file to EXIST — without it `config` fails with
        # "env file /…/infra/.env not found" before it parses anything.
        #
        # Copying the example rather than touching an empty file is the more
        # useful of the two: it also asserts that the file README tells a new
        # contributor to copy still carries every variable the dev stack marks
        # required, so the two cannot drift apart unnoticed. Its placeholder
        # secrets are fine — nothing in this job starts a container.
        run: cp .env.example .env
      - name: Validate the dev stack
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate the production stack
        # The values user_data.sh.tftpl assembles on the box from SSM are not in
        # .env.example, so they are supplied here as throwaways: this checks the
        # file's shape, not the deployment's secrets.
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
          RXHIVE_S3_BUCKET: ci
          AWS_REGION: us-east-1
          SITE_ADDRESS: ci.example.com
      - name: Every long-lived container caps its logs
        # Docker's json-file driver is unbounded by default and these containers
        # run for the life of the box, so an uncapped service fills the 40 GB
        # root volume and stops the stack.
        #
        # Asserted per service rather than by grepping for the YAML anchor: a
        # service added later without `logging:` is exactly the regression worth
        # catching, and it would not mention the anchor.
        #
        # The budget, not the literal values. Requiring max-size == "10m" would
        # fail a deliberate retune to 20m that is still perfectly bounded, while
        # merely requiring max-size to be PRESENT would pass "100g", which is
        # unbounded in every sense that matters here. So the check resolves
        # max-size x max-file per service and holds the fleet total against a
        # ceiling — which is the property the root volume actually cares about.
        run: |
          docker compose -f docker-compose.prod.yml config --format json \
            | python3 -c '
          import json, sys

          # Docker accepts a k/m/g suffix on max-size; no suffix means bytes.
          UNITS = {"": 1, "b": 1, "k": 1024, "m": 1024**2, "g": 1024**3}
          MIB = 1024**2
          TOTAL_BUDGET_MIB = 1024

          def to_bytes(value):
              text = str(value).strip().lower()
              digits = text.rstrip("bkmg")
              suffix = text[len(digits):].rstrip("b") if digits else ""
              return int(float(digits) * UNITS[suffix])

          services = json.load(sys.stdin)["services"]
          problems = []
          total = 0
          for name, svc in sorted(services.items()):
              logging = svc.get("logging") or {}
              options = logging.get("options") or {}
              driver = logging.get("driver")
              size = options.get("max-size")
              files = options.get("max-file")
              if driver != "json-file":
                  problems.append(name + ": driver is " + repr(driver) + ", expected json-file")
                  continue
              if not size or not files:
                  problems.append(name + ": json-file without both max-size and max-file, so unbounded")
                  continue
              budget = to_bytes(size) * int(files)
              total += budget
              print("  {}: {} x {} = {} MiB".format(name, size, files, budget // MIB))
          if problems:
              sys.exit("uncapped or unexpected logging:" + "".join("\n  " + p for p in problems))
          total_mib = total // MIB
          print("total log budget across {} services: {} MiB".format(len(services), total_mib))
          if total_mib > TOTAL_BUDGET_MIB:
              sys.exit("total {} MiB exceeds the {} MiB ceiling for a 40 GB root volume".format(total_mib, TOTAL_BUDGET_MIB))
          '
        env:
          RXHIVE_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
          RXHIVE_S3_BUCKET: ci
          AWS_REGION: us-east-1
          SITE_ADDRESS: ci.example.com

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # full stack + LiveKit + Playwright; the suite runs ~4 min locally
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rxhive
          POSTGRES_USER: rxhive
          POSTGRES_PASSWORD: rxhive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rxhive" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      minio:
        # minio/minio:edge-cicd, not bitnami/minio — Bitnami withdrew their public
        # Docker Hub catalogue and that tag now 404s, which failed this job at
        # container start before a single step ran. The edge-cicd tag is MinIO's
        # own build for exactly this: its default command is `minio server /data`,
        # and a GitHub Actions service container has no way to supply one.
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: rxhive
          MINIO_ROOT_PASSWORD: rxhive-dev
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RXHIVE_DATABASE_URL: postgresql+asyncpg://rxhive:rxhive@localhost:5432/rxhive
      RXHIVE_REDIS_URL: redis://localhost:6379/0
      RXHIVE_S3_ENDPOINT: http://localhost:9000
      RXHIVE_S3_PUBLIC_ENDPOINT: http://localhost:9000
      RXHIVE_S3_ACCESS_KEY: rxhive
      RXHIVE_S3_SECRET_KEY: rxhive-dev
      RXHIVE_LIVEKIT_API_KEY: devkey
      RXHIVE_LIVEKIT_API_SECRET: devsecret-at-least-32-characters-long
      RXHIVE_SEED_SUPERADMIN_EMAIL: admin@rhythmrx.ai
      RXHIVE_SEED_SUPERADMIN_PASSWORD: CiSuperadminPass123
      # All E2E traffic shares one source IP — raise the per-IP login budget.
      RXHIVE_RATE_LIMIT_LOGIN: "200"
      E2E_API_URL: http://127.0.0.1:8000
      E2E_SUPERADMIN_PASSWORD: CiSuperadminPass123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Start API
        working-directory: backend
        # No PID is recorded: nothing read the API_PID that used to be exported
        # here, so it promised a cleanup step that does not exist. The runner is
        # torn down with the job, which is what actually stops the process.
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 &

      # Calling tests need a real SFU. Without one they skip rather than fail —
      # which is why this step must fail loudly instead: a silent skip takes the
      # 18 calling specs out of the run and the job still reports green.
      - name: Start LiveKit SFU
        run: |
          # pipefail, because the default is for `curl ... | bash` to report the
          # exit status of bash alone. A failed or empty download then "succeeds"
          # and the missing binary only surfaces further down.
          set -o pipefail
          curl -sSL https://get.livekit.io | bash
          cat > /tmp/livekit.yaml <<'YAML'
          port: 7880
          rtc:
            port_range_start: 50000
            port_range_end: 50020
            tcp_port: 7881
            use_external_ip: false
          redis:
            address: 127.0.0.1:6379
          YAML
          LIVEKIT_KEYS="devkey: devsecret-at-least-32-characters-long" \
            livekit-server --config /tmp/livekit.yaml &
          # A bare `for ... do curl && break; sleep 1; done` always exits 0 — the
          # loop's status is the last `sleep`. So an SFU that never came up left
          # this step green, global-setup logged "calling tests will skip", and
          # the job passed having tested no calls at all. Calls are the part of
          # this app that breaks most; losing that coverage silently is worse
          # than a red build.
          ready=
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7880 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::LiveKit SFU never answered on :7880 — the calling E2E tests would silently skip."
            exit 1
          fi

      # `--with-deps` shells out to apt, and apt is the least reliable thing in
      # this job. Two distinct failures now, both of which spent the step's whole
      # budget and reported nothing but a timeout:
      #
      #   * azure.archive.ubuntu.com black-holed (2026-08-19, run 32226387155).
      #     apt's desktop defaults — a long per-connection timeout, retried,
      #     against each mirror in turn — ran to 38 minutes in this one step.
      #     The Acquire settings below fixed that: the fail-over now takes ~30s.
      #
      #   * The canonical archive then stalled MID-TRANSFER (run 32270826562,
      #     twice in a row). apt fetched every InRelease and went silent for
      #     eleven and a half minutes. The Acquire settings cannot help here and
      #     never could: Acquire::*::Timeout is an INACTIVITY timeout, so a mirror
      #     that trickles bytes never trips it, and Acquire::Retries makes it
      #     worse by doing it three times.
      #
      # So apt gets a wall-clock bound it has no setting for, and stops being
      # able to fail this job at all. Three changes, in order:
      #
      # 1. The browser BINARY is installed on its own. It comes from Playwright's
      #    CDN rather than apt, and it is the half that genuinely cannot be
      #    skipped, so it must not share a failure domain with the mirrors.
      # 2. The system libraries — the apt half — are bounded with `timeout` and
      #    made non-fatal. ubuntu-24.04 ships Chromium's dependencies already;
      #    this run is belt-and-braces, not a prerequisite, and it had no business
      #    being able to take the job down.
      # 3. Which makes the launch check the real gate. If a library IS missing,
      #    chromium fails to launch here, once, with the reason — instead of
      #    taking out all 40-odd specs one confusing failure at a time, which is
      #    exactly the silent-skip shape the LiveKit step above exists to prevent.
      #
      # The step cap stays as the backstop for whatever this still does not
      # anticipate. Generous: this step normally takes about two minutes.
      - name: Install frontend + browsers
        timeout-minutes: 12
        working-directory: frontend
        run: |
          set -euo pipefail

          sudo tee /etc/apt/apt.conf.d/99-ci-resilience >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APTCONF

          npm ci
          npx playwright install chromium

          # `sudo timeout`, not `timeout sudo`: timeout signals its direct child,
          # and with sudo in between it is sudo that gets the TERM rather than the
          # apt holding the lock.
          sudo timeout 180 apt-get update \
            || echo "::warning::apt-get update timed out or failed — falling back to the runner's preinstalled libraries"
          timeout 240 npx playwright install-deps chromium \
            || echo "::warning::playwright install-deps timed out or failed — falling back to the runner's preinstalled libraries"

          node -e "require('@playwright/test').chromium.launch().then(b => b.close()).then(() => console.log('chromium launches'))"

      # global-setup waits for /api/health and fails loudly if the stack is down.
      # Chromium fake media devices make the calling tests hardware-free.
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # two image builds from cold
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This workflow only ever reads the tree. Left at the default,
          # checkout leaves the job's token in .git/config for everything
          # that runs afterwards — including third-party actions, a remote
          # install script and a browser.
          persist-credentials: false
      - name: Build backend image
        run: docker build -t rxhive-api ./backend
      - name: Build frontend image
        run: docker build -t rxhive-web ./frontend
