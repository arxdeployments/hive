# Security headers for the static shell (the API sets its own).
#
# A snippet rather than four lines in the server block, because nginx inherits
# add_header into a location ONLY while that location declares no add_header of
# its own — and every location in nginx.conf sets its own Cache-Control. So all
# four of these were being dropped from every single response, the SPA document
# included: verified against nginx:alpine, where `curl -I` on /, /index.html,
# /sw.js and /assets/* each returned Cache-Control and nothing else. The app was
# framable and running with no CSP while the config above it looked correct.
#
# nginx has no "inherit the parent's headers" directive, so every location that
# sets a header must include this file too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# form-action 'self' added alongside the restore: without it CSP does not stop a
# injected form from posting credentials off-origin, which is the one gap
# frame-ancestors and script-src leave open on a login page.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
