# Security headers for the static shell (the API sets its own).
#
# A snippet rather than four lines in the server block, because nginx inherits
# add_header into a location ONLY while that location declares no add_header of
# its own — and every location in nginx.conf sets its own Cache-Control. So all
# four of these were being dropped from every single response, the SPA document
# included: verified against nginx:alpine, where `curl -I` on /, /index.html,
# /sw.js and /assets/* each returned Cache-Control and nothing else. The app was
# framable and running with no CSP while the config above it looked correct.
#
# nginx has no "inherit the parent's headers" directive, so every location that
# sets a header must include this file too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# form-action 'self' added alongside the restore: without it CSP does not stop a
# injected form from posting credentials off-origin, which is the one gap
# frame-ancestors and script-src leave open on a login page.
#
# connect-src is 'self' and nothing else. It used to read `'self' ws: wss:`, and
# those two extra tokens are bare scheme-sources: they match ANY host, so the
# directive restricted nothing at all about where a websocket could go. Injected
# or supply-chain script could open wss://attacker/ and stream a conversation out
# without raising a violation, and `ws:` additionally permitted a cleartext
# socket from an HTTPS document.
#
# Neither socket this app opens needs them. The chat socket is built from
# VITE_BACKEND_URL || window.location.origin (src/services/websocket.js), and
# .env.example ships that variable empty; the LiveKit signal URL defaults to the
# path "/livekit" (infra/docker-compose*.yml), which livekitClient's
# _absoluteUrl() resolves against window.location and Caddy proxies on the same
# origin. Both are same-origin, and CSP3 has 'self' match ws:// and wss:// on the
# document's own host and port, so 'self' alone already carries them.
#
# Deliberately NOT `wss://$host ws://$host`, which looks like the tighter form
# and is worse: this server declares no server_name, so it answers to any
# hostname and nginx will render whatever Host arrives straight into the header.
# `Host: *` comes back as `connect-src 'self' wss://* ws://*` — the wildcard
# handed back to whoever asked for it. A literal is the only safe shape here.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
