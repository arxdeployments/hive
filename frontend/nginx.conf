server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # See nginx-security-headers.conf for why this is included per-location
    # rather than declared once here: any location that sets its own header
    # discards every inherited one, and all three below set Cache-Control.
    include /etc/nginx/snippets/security-headers.conf;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the shell or the service worker
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
