server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response (the API sets its own; these cover the
    # static shell). CSP allows same-origin + the connect targets the SPA needs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the shell or the service worker
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
