# LiveKit server config (self-hosted SFU).
# API keys are injected via the LIVEKIT_KEYS env var in docker-compose.
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  # The address clients are told to send media to, in ICE candidates.
  #
  # `use_external_ip: true` makes the SFU STUN out and advertise the host's PUBLIC
  # address. That is right for a deployed server behind NAT and wrong for anything
  # on a LAN: a phone on the same Wi-Fi cannot reach its own network's public IP
  # (home routers rarely hairpin), so signalling succeeds, the call shows as
  # connected, and no media ever arrives. Nothing in the logs says so — it looks
  # exactly like a broken app.
  #
  # It is also wrong to advertise nothing: with use_external_ip off and no node_ip,
  # the SFU offers its own container address (172.x on the compose bridge), which no
  # client outside Docker can reach either.
  #
  # So: set LIVEKIT_NODE_IP in infra/.env to the host's LAN address when testing
  # against a phone or another machine, and leave it empty for a real deployment,
  # which restores use_external_ip. Substituted at start-up by the livekit service's
  # entrypoint, for the same reason webhook.api_key is — livekit-server does not
  # expand env vars inside its config file.
  use_external_ip: __LIVEKIT_USE_EXTERNAL_IP__
  node_ip: __LIVEKIT_NODE_IP__
redis:
  address: redis:6379

# Server-to-server event delivery to the API. Mounting the endpoint is only half
# the fix — without this block the SFU never calls it, so the API learns nothing
# about what actually happened in a room.
#
# What it buys: room_finished lets the API mark a call answered and publish
# call:ended with a real duration, which is what stops a client that was killed
# mid-call from leaving the row "connected" forever. participant_joined /
# participant_left keep the roster honest when a browser tab dies without sending
# call:leave.
webhook:
  # Substituted at container start-up from LIVEKIT_API_KEY — see the livekit
  # service's entrypoint in docker-compose.yml. NOT a literal.
  #
  # It has to be a placeholder rather than a hardcoded key: LiveKit requires
  # webhook.api_key to be one of the keys in LIVEKIT_KEYS, that comes from the
  # .env, and livekit-server does **not** expand env vars inside its config file
  # (verified — it reads `${VAR}` literally). A hardcoded key that does not match
  # the deployment's LIVEKIT_API_KEY makes livekit-server refuse to start with
  # "api_key is required to use webhooks", and it crash-loops: calls break
  # entirely, and the API starts reporting "livekit":"unreachable" because the
  # container is never up long enough to resolve.
  api_key: __LIVEKIT_API_KEY__
  urls:
    # The compose service name, on the internal network — deliberately not the
    # public Caddy hostname. This traffic never needs to leave the bridge, and
    # keeping it internal means the endpoint is not a public attack surface
    # (it verifies its JWT regardless, but there is no reason to expose it).
    - http://api:8000/api/livekit/webhook

logging:
  level: info
